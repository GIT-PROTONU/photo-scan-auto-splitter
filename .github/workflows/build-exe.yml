name: Build Windows exe

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyinstaller pillow numpy
      - run: pyinstaller --noconfirm PhotoSplit.spec
      - uses: actions/upload-artifact@v4
        with:
          name: PhotoSplit-exe
          path: dist/PhotoSplit.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PhotoSplit.exe
